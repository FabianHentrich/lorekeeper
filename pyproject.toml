[project]
name = "lorekeeper"
version = "0.2.0"
description = "RAG-based Q&A System for Structured Worldbuilding Documents"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Table-like fixture rows read better on one line
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "evaluation"]
explicit_package_bases = true
ignore_missing_imports = true
