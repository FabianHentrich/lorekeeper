# ─────────────────────────────────────────
# LoreKeeper Configuration
# ─────────────────────────────────────────

# Ingestion
# Sources are configured in config/sources.yaml (sidecar, gitignored).
ingestion:
  supported_formats: [".md", ".pdf", ".png", ".jpg", ".jpeg", ".webp"]
  exclude_patterns:
    - ".obsidian/*"
    - ".trash/*"
    - "*alt.md"
    - "*(1).md"
    - "*.draft.*"

# Chunking
chunking:
  strategy: heading_aware
  max_chunk_size: 256           # ~900 Zeichen Fließtext; e5-base hat 512-Token-Limit
  chunk_overlap: 30             # nur für Fließtext; Tabellen erhalten kein Overlap
  min_chunk_size: 20

# Embeddings
embeddings:
  model: "intfloat/multilingual-e5-base"
  device: auto
  batch_size: 64
  normalize: true

# Vector Store
vectorstore:
  persist_directory: ./chroma_data   # embedded ChromaDB in the backend process
  collection_name: lorekeeper
  distance_metric: cosine
  hnsw_ef_search: 1000            # exakte, reproduzierbare Suche bei ~5 k Chunks (+2 ms/Abfrage; Roadmap 5.5)

# Retrieval
retrieval:
  top_k: 15          # fetch candidates; reranker selects best 8
  score_threshold: 0.5
  hybrid:
    enabled: false            # vector + BM25 fused via RRF; per-request override via hybrid_search
    bm25_weight: 0.3          # BM25 share in RRF (0.0 = pure vector, 1.0 = pure BM25)
    bm25_top_k: 15            # how many BM25 candidates to fetch before fusion
  reranking:
    enabled: true
    model: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"  # multilingual
    backend: directml         # torch = CPU | directml = GPU via onnxruntime-directml (CPU fallback with a warning)
    top_k_rerank: 8
    max_per_source: 3         # cap chunks per single file (0 = unlimited) — prevents one dense doc from crowding others
  section_expansion:
    enabled: true             # ≥2 hits under one parent heading → hand the LLM the whole section
    max_chunks: 25            # larger sections are not expanded (protects the LLM context)
    top_rank: 3               # only expand if a hit is among the first N ranked chunks (0 = no limit)
  rules_slot:                 # entity + rule term ("Was bewirkt Ritterlichkeit bei Escanor?") → 1 rulebook chunk
    enabled: true
    candidates: 5             # separate vector search inside group "rules" (same filters as the request)
    min_score: -4.0           # best rules chunk takes the last place if no rules chunk made it and it scores ≥ this

# LLM
llm:
  provider: ollama
  fallback_provider: gemini
  fallback_enabled: false
  ollama:
    base_url: "http://127.0.0.1:11434"
    model: "qwen3:14b"
    temperature: 0.3
    top_p: 0.9
    max_tokens: 2048
    timeout: 300
  gemini:
    model: "gemini-2.5-flash"
    api_key_env: GEMINI_API_KEY
    temperature: 0.3
    top_p: 0.9
    max_tokens: 8192
    timeout: 30

# Conversation
conversation:
  window_size: 8
  max_context_tokens: 4096
  answer_history_pairs: 1         # QA pairs the answer prompt sees (0 = off) — more dilutes the sources
  answer_history_max_chars: 1500  # each message of that history (question and answer) is cut here
  condense_question: true
  condense_model: null
  session_timeout_minutes: 60
  session_gc_interval_seconds: 300

# Logging
logging:
  level: INFO                       # DEBUG | INFO | WARNING | ERROR
  file: logs/lorekeeper.log         # null = nur Console
  rotate_hour: 6                    # neue Logdatei pro Tag ab dieser Uhrzeit (nach Mitternacht: ein Spielabend bleibt in einer Datei)
  backup_count: 30                  # so viele vergangene Tage behalten (lorekeeper.<JJJJ-MM-TT>.log)
  suppress:                         # Third-Party Logger auf ERROR setzen (ersetzt die Liste im Code)
    - httpx
    - httpx2                        # HTTP-Client des openai-SDK: eine Zeile pro Ollama-Aufruf
    - httpcore
    - openai
    - google_genai                  # "AFC is enabled" bei jedem Gemini-Aufruf
    - chromadb
    - huggingface_hub
    - sentence_transformers
    - safetensors
    - model_utils
